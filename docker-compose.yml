services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flumbericoco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flumbericoco_db
      POSTGRES_USER: flumbericoco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flumbericoco_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - flumbericoco_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flumbericoco_user -d flumbericoco_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for BullMQ and caching
  redis:
    image: redis:7-alpine
    container_name: flumbericoco_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flumbericoco_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    command: >
      sh -c '
      if [ -z "${REDIS_PASSWORD:-}" ]; then
        redis-server --appendonly yes
      else
        redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
      fi
      '

  # Adminer (Database Management Tool) - Optional for development
  adminer:
    image: adminer:latest
    container_name: flumbericoco_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - flumbericoco_network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  flumbericoco_network:
    driver: bridge